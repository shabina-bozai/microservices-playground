syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.demo.grpc.realworld";
option java_outer_classname = "OrderProto";

package order;

service OrderService {
    // Unary: place an order
    rpc PlaceOrder (PlaceOrderRequest) returns (OrderConfirmation);

    // Server streaming: track order status updates
    rpc TrackOrder (TrackOrderRequest) returns (stream OrderStatus);
}

message PlaceOrderRequest {
    string product_name = 1;
    int32 quantity = 2;
    string customer_name = 3;
}

message OrderConfirmation {
    string order_id = 1;
    string message = 2;
}

message TrackOrderRequest {
    string order_id = 1;
}

message OrderStatus {
    string order_id = 1;
    string status = 2;
    string detail = 3;
    int64 timestamp = 4;
}
